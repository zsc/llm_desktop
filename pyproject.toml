[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-semantic-indexer"
version = "0.1.0"
description = "Local multimodal semantic indexer and search (offline-first)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "psutil>=5.9",
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
vectors = ["hnswlib>=0.8.0"]
clip = ["open_clip_torch>=2.23.0"]
whisper = ["openai-whisper>=20231117"]
archives = ["py7zr>=0.20"]
watch = ["watchdog>=4.0"]

[project.scripts]
lsi = "lsi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lsi*"]
